name: vetx

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: vetx_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-56432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6.3-alpine
    user: redis
    command: ["sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_ORIGIN:?Set KEYCLOAK_PUBLIC_ORIGIN}
      OIDC_API_CLIENT_ID: ${OIDC_API_CLIENT_ID:?Set OIDC_API_CLIENT_ID}
      OIDC_API_CLIENT_SECRET: ${OIDC_API_CLIENT_SECRET:?Set OIDC_API_CLIENT_SECRET}
      OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:?Set OIDC_WEB_CLIENT_ID}
      OIDC_WEB_CLIENT_SECRET: ${OIDC_WEB_CLIENT_SECRET:?Set OIDC_WEB_CLIENT_SECRET}
      OIDC_STAFF_CLIENT_ID: ${OIDC_STAFF_CLIENT_ID:?Set OIDC_STAFF_CLIENT_ID}
      OIDC_OWNER_CLIENT_ID: ${OIDC_OWNER_CLIENT_ID:?Set OIDC_OWNER_CLIENT_ID}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?Set WEB_PUBLIC_ORIGIN}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-58080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/vetx-realm.json:/opt/keycloak/data/import/vetx-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.28.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-58025}:8025"

  storage:
    image: rustfs/rustfs:1.0.0
    profiles: [integrations]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:${S3_PORT:-59000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  orthanc:
    image: orthancteam/orthanc:26.9.0
    profiles: [integrations]
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: ${ORTHANC_REGISTERED_USERS:?Set ORTHANC_REGISTERED_USERS}
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "false"
    ports:
      - "127.0.0.1:${ORTHANC_HTTP_PORT:-58042}:8042"
      - "127.0.0.1:${ORTHANC_DICOM_PORT:-54242}:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "python3", "/probes/test-aliveness.py"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  storage-data:
  orthanc-data:
